<!-- Wazuh agent group "windows": every Windows host in the lab.
     Adds channels on top of the agent defaults (Application, Security, System, Sysmon). -->
<agent_config os="Windows">

  <!-- 4104 script block logging, 4103 pipeline execution -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows LAPS: rotations (10020), failures (10005), policy processing; corroborates rule 100534 -->
  <localfile>
    <location>Microsoft-Windows-LAPS/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Defender detections and tampering (1116, 1117, 5001, 5007) -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
